{% extends 'base.html' %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <i class="bi bi-question-circle text-muted display-1 d-block mb-3"></i>
        <h2 class="fw-bold text-dark">404 - Page Not Found</h2>
        <p class="text-muted">The requested medicine record, batch, or page was not found in the pharmacy system.</p>
        <a href="{% url 'dashboard' %}" class="btn btn-primary mt-2">
            <i class="bi bi-speedometer2 me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
